<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meet-Up</title>
  </head>
  <body>
    <div class="ion-header">
      <span class="ion-title">Meet-Up</span>
      <span style="font-size: 1.5em; color: #3b82f6">&#128100;</span>
    </div>
    <div class="ion-content" id="main-content">
      <!-- Profile Card -->
      <div class="profile-card" id="profile-card">
        <img
          class="profile-img"
          id="profile-img"
          src="https://randomuser.me/api/portraits/women/44.jpg"
          alt="Profile"
        />
        <div class="profile-info">
          <div>
            <span class="profile-name" id="profile-name">Anna</span>
            <span class="profile-age" id="profile-age">23</span>
          </div>
          <div class="profile-bio" id="profile-bio">
            喜歡旅行、攝影和咖啡。尋找有趣的靈魂一起探索世界！
          </div>
          <div class="profile-tags" id="profile-tags">
            <span class="tag">旅行</span>
            <span class="tag">攝影</span>
            <span class="tag">咖啡</span>
          </div>
        </div>
        <div class="action-bar">
          <button class="action-btn" onclick="prevProfile()" title="上一個">
            &#10094;
          </button>
          <button class="action-btn" onclick="dislike()" title="不喜歡">
            &#10060;
          </button>
          <button class="action-btn" onclick="like()" title="喜歡">
            &#10084;
          </button>
          <button class="action-btn" onclick="superLike()" title="超級喜歡">
            &#11088;
          </button>
          <button class="action-btn" onclick="nextProfile()" title="下一個">
            &#10095;
          </button>
        </div>
      </div>
    </div>
    <div class="ion-tab-bar">
      <button class="ion-tab-btn active" title="主頁">&#8962;</button>
      <button class="ion-tab-btn" title="配對">&#128101;</button>
      <button class="ion-tab-btn" title="訊息">&#128172;</button>
      <button class="ion-tab-btn" title="個人">&#128100;</button>
    </div>
  </body>
</html>
